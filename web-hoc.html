<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jialingg de xiaowu 🐰</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8fb;--card:#fff;--pink:#fde0ec;--pink-d:#f4a3c0;--soft:#fff0f6;--text:#6b4558;--muted:#b58a9e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1a23;--card:#3a2430;--pink:#7a3b57;--pink-d:#f59cc0;--soft:#4a2d3c;--text:#fbe4ee;--muted:#c79bb0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a1a23;--card:#3a2430;--pink:#7a3b57;--pink-d:#f59cc0;--soft:#4a2d3c;--text:#fbe4ee;--muted:#c79bb0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Quicksand',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:500}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;margin:4px 0 2px;text-align:center}
.sub{text-align:center;color:var(--muted);margin:0 0 18px}
.tabs{display:flex;gap:8px;background:var(--soft);padding:6px;border-radius:999px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:700;padding:10px 4px;font-size:13px;border-radius:999px;cursor:pointer}
.tabs button.on{background:var(--pink-d);color:#fff}
.card{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 6px 20px rgba(224,112,154,.15)}
.hide{display:none}
.time{font-size:64px;font-weight:700;text-align:center;color:var(--pink-d);margin:10px 0;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{border:0;background:var(--pink-d);color:#fff;font:inherit;font-weight:700;padding:11px 20px;border-radius:999px;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--pink-d)}
.stat{text-align:center;color:var(--muted);margin-top:14px}
input,textarea{width:100%;font:inherit;color:var(--text);background:var(--soft);border:2px solid transparent;border-radius:14px;padding:11px 14px;outline:none}
input:focus,textarea:focus{border-color:var(--pink-d)}
.add{display:flex;gap:8px;margin-bottom:14px}
.add input{flex:1}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px dashed var(--pink)}
li.done span{text-decoration:line-through;color:var(--muted)}
li span{flex:1;word-break:break-word}
li input[type=checkbox]{width:20px;height:20px;accent-color:var(--pink-d);flex:none}
.x{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer}
.fc{min-height:170px;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--soft);border-radius:20px;padding:20px;font-size:20px;font-weight:700;cursor:pointer;margin:12px 0;user-select:none}
.fc.back{background:var(--pink-d);color:#fff}
.empty{text-align:center;color:var(--muted);padding:12px}
.two{display:grid;gap:8px;margin-bottom:12px}
.sub-tabs{display:flex;gap:8px;margin-bottom:14px}
.sub-tabs button{flex:1;border:2px solid var(--pink);background:none;color:var(--muted);font:inherit;font-weight:700;padding:8px;border-radius:14px;cursor:pointer}
.sub-tabs button.on{background:var(--pink-d);border-color:var(--pink-d);color:#fff}
.vz{font-size:22px;font-weight:700}
.ef{margin:2px 0 8px;font-size:14px;padding:8px 10px;border-radius:10px}
.zr{display:grid;grid-template-columns:1fr 1fr 1.5fr 26px;gap:6px;margin-bottom:6px;align-items:start}
.zr input,.zr textarea{padding:8px 10px;font-size:14px;border-radius:10px}
.zr.gr{grid-template-columns:1fr 26px;border-bottom:1px dashed var(--pink);padding-bottom:8px;margin-bottom:10px}
.zr.gr input,.zr.gr textarea{grid-column:1}
.zr.gr .x{grid-column:2;grid-row:1}
.zh{margin:16px 0 8px;font-size:16px;color:var(--pink-d)}
.stb button.has{border-color:var(--pink-d)}
select{font:inherit;color:var(--text);background:var(--soft);border:2px solid transparent;border-radius:14px;padding:10px}

.slo{font-size:13px;line-height:1.6;padding:0 8px}
.big{display:flex;gap:8px;margin-bottom:16px}
.big button{flex:1;border:0;background:var(--soft);color:var(--muted);font:inherit;font-weight:700;font-size:14px;padding:12px 6px;border-radius:18px;cursor:pointer}
.big button.on{background:var(--pink-d);color:#fff}
.stb{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.stb button{flex:1;border:2px solid var(--pink);background:none;color:var(--muted);font:inherit;font-weight:700;padding:8px;border-radius:14px;cursor:pointer}
.stb button.on{background:var(--pink-d);border-color:var(--pink-d);color:#fff}
.vp{color:var(--pink-d)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Jialingg de xiaowu 🐰</h1>
  <p class="sub slo">如果你真正喜欢一个东西，那份喜欢就是你人生中最大肯定和成功</p>
  <div class="big" id="big"><button data-b="A" class="on">Học nhanh còn xem phim 🎬</button><button data-b="B">2026 🔒</button></div>
  <div id="bA">
  <div class="tabs" id="tabs">
    <button data-t="p" class="on">⏰ Pomodoro</button>
    <button data-t="t">📝 Việc cần làm</button>
    <button data-t="f">🃏 Flashcard</button>
    <button data-t="z">🀄 Tiếng Trung</button>
  </div>

  <div class="card" id="p">
    <div class="row"><button class="btn" id="mF">Tập trung 25′</button><button class="btn alt" id="mB">Nghỉ 5′</button></div>
    <div class="time" id="time">25:00</div>
    <div class="row"><button class="btn" id="go">Bắt đầu</button><button class="btn alt" id="rs">Reset</button></div>
    <div class="stat" id="stat"></div>
  </div>

  <div class="card hide" id="t">
    <div class="add"><input id="ti" placeholder="Hôm nay ôn gì nè?" maxlength="120"><button class="btn" id="ta">Thêm</button></div>
    <ul id="tl"></ul>
  </div>

  <div class="card hide" id="f">
    <div id="study"></div>
    <hr style="border:0;border-top:2px dashed var(--pink);margin:18px 0">
    <div class="two"><input id="fq" placeholder="Mặt trước (câu hỏi)" maxlength="200"><textarea id="fa" rows="2" placeholder="Mặt sau (đáp án)" maxlength="400"></textarea></div>
    <div class="row"><button class="btn" id="fadd">Thêm thẻ</button></div>
  </div>

  <div class="card hide" id="z">
    <div class="sub-tabs"><button data-s="zf" class="on">Flashcard</button><button data-s="zv">Từ vựng</button><button data-s="zg">Ngữ pháp</button><button data-s="zi">Thành ngữ</button></div>
    <div id="zf">
      <div id="zstudy"></div>
      <hr style="border:0;border-top:2px dashed var(--pink);margin:18px 0">
      <div class="two"><input id="zq" placeholder="Mặt trước (chữ Hán)" maxlength="100"><textarea id="za" rows="2" placeholder="Mặt sau (pinyin, nghĩa...)" maxlength="300"></textarea></div>
      <div class="row"><button class="btn" id="zadd">Thêm thẻ</button></div>
    </div>
    <div id="zv" class="hide"></div>
    <div id="zg" class="hide"></div>
    <div id="zi" class="hide"></div>
  </div>
  </div>

  <div id="bB" class="hide">
    <div class="card hide" id="ygate"></div>
    <div id="yr" class="hide">
      <div class="tabs" id="ytabs"><button data-y="phim" class="on">🎬 Phim</button><button data-y="truyen">📚 Truyện</button><button data-y="ky">💌 Kỉ niệm</button></div>
      <div class="card" id="ypanel"></div>
    </div>
  </div>
</div>

<script>
var S={tasks:[],cards:[],sessions:{},vocab:[],zcards:[],y:{}};
try{var raw=localStorage.getItem('webhoc');if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem('webhoc',JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

/* tabs */
document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){
  document.querySelectorAll('#tabs button').forEach(function(x){x.classList.toggle('on',x===b)});
  ['p','t','f','z'].forEach(function(id){$(id).classList.toggle('hide',id!==b.dataset.t)});
}});

/* pomodoro */
var mode=25*60,left=mode,timer=null;
function today(){return new Date().toISOString().slice(0,10)}
function draw(){var m=Math.floor(left/60),s=left%60;$('time').textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  $('stat').textContent='Hôm nay đã xong '+(S.sessions[today()]||0)+' phiên tập trung 🍓';$('go').textContent=timer?'Tạm dừng':'Bắt đầu'}
function setMode(sec){clearInterval(timer);timer=null;mode=sec;left=sec;draw()}
$('mF').onclick=function(){setMode(25*60)};$('mB').onclick=function(){setMode(5*60)};
$('rs').onclick=function(){setMode(mode)};
$('go').onclick=function(){
  if(timer){clearInterval(timer);timer=null;draw();return}
  timer=setInterval(function(){left--;if(left<=0){clearInterval(timer);timer=null;left=0;
    if(mode===25*60){S.sessions[today()]=(S.sessions[today()]||0)+1;save()}
    draw();alert('Hết giờ rồi! 🌸')}else draw()},1000);draw()};
draw();

/* tasks */
function drawT(){var h='';S.tasks.forEach(function(t,i){
  h+='<li class="'+(t.d?'done':'')+'"><input type="checkbox" '+(t.d?'checked':'')+' data-c="'+i+'"><span>'+esc(t.x)+'</span><button class="x" data-r="'+i+'">×</button></li>'});
  $('tl').innerHTML=h||'<div class="empty">Chưa có việc nào, thêm đi nè ✨</div>'}
$('ta').onclick=function(){var v=$('ti').value.trim();if(!v)return;S.tasks.unshift({x:v,d:false});$('ti').value='';save();drawT()};
$('ti').onkeydown=function(e){if(e.key==='Enter')$('ta').onclick()};
$('tl').onclick=function(e){var c=e.target.dataset.c,r=e.target.dataset.r;
  if(c!==undefined){S.tasks[c].d=e.target.checked}else if(r!==undefined){S.tasks.splice(r,1)}else return;save();drawT()};
drawT();

/* flashcards */
var ci=0,flip=false;
function drawF(){var el=$('study');
  if(!S.cards.length){el.innerHTML='<div class="empty">Chưa có thẻ nào, tạo thẻ đầu tiên bên dưới nha 💌</div>';return}
  if(ci>=S.cards.length)ci=0;var c=S.cards[ci];
  el.innerHTML='<div class="stat" style="margin:0">Thẻ '+(ci+1)+'/'+S.cards.length+' · bấm vào thẻ để lật</div>'+
  '<div class="fc'+(flip?' back':'')+'" id="fc">'+esc(flip?c.a:c.q)+'</div>'+
  '<div class="row"><button class="btn alt" id="pv">‹ Trước</button><button class="btn alt" id="dl">Xoá</button><button class="btn" id="nx">Sau ›</button></div>';
  $('fc').onclick=function(){flip=!flip;drawF()};
  $('pv').onclick=function(){ci=(ci-1+S.cards.length)%S.cards.length;flip=false;drawF()};
  $('nx').onclick=function(){ci=(ci+1)%S.cards.length;flip=false;drawF()};
  $('dl').onclick=function(){S.cards.splice(ci,1);flip=false;save();drawF()}}
$('fadd').onclick=function(){var q=$('fq').value.trim(),a=$('fa').value.trim();if(!q||!a)return;
  S.cards.push({q:q,a:a});$('fq').value='';$('fa').value='';ci=S.cards.length-1;flip=false;save();drawF()};
drawF();
/* tieng trung */
document.querySelectorAll('.sub-tabs button').forEach(function(b){b.onclick=function(){
  document.querySelectorAll('.sub-tabs button').forEach(function(x){x.classList.toggle('on',x===b)});
  ['zf','zv','zg','zi'].forEach(function(id){$(id).classList.toggle('hide',id!==b.dataset.s)});if(b.dataset.s!=='zf')drawZ(b.dataset.s.charAt(1));
}});
var zi=0,zflip=false;
function drawZF(){var el=$('zstudy'),C=S.zcards;
  if(!C.length){el.innerHTML='<div class="empty">Chưa có thẻ tiếng Trung nào, tạo thẻ bên dưới nha 💌</div>';return}
  if(zi>=C.length)zi=0;var c=C[zi];
  el.innerHTML='<div class="stat" style="margin:0">Thẻ '+(zi+1)+'/'+C.length+' · bấm vào thẻ để lật</div>'+
  '<div class="fc'+(zflip?' back':'')+'" id="zfc">'+esc(zflip?c.a:c.q)+'</div>'+
  '<div class="row"><button class="btn alt" id="zpv">‹ Trước</button><button class="btn alt" id="zdl">Xoá</button><button class="btn" id="znx">Sau ›</button></div>';
  $('zfc').onclick=function(){zflip=!zflip;drawZF()};
  $('zpv').onclick=function(){zi=(zi-1+C.length)%C.length;zflip=false;drawZF()};
  $('znx').onclick=function(){zi=(zi+1)%C.length;zflip=false;drawZF()};
  $('zdl').onclick=function(){C.splice(zi,1);zflip=false;save();drawZF()}}
$('zadd').onclick=function(){var q=$('zq').value.trim(),a=$('za').value.trim();if(!q||!a)return;
  S.zcards.push({q:q,a:a});$('zq').value='';$('za').value='';zi=S.zcards.length-1;zflip=false;save();drawZF()};
drawZF();
/* tieng trung theo bai */

if(!Z.seeded)Z.seeded={};

ặc như lời người khác nói. Dùng trước động từ vị ngữ, tính từ hoặc chủ ngữ.", "天气预报说今天有雨，你看，果然下起来了。"], ["【词语用法】对于 (giới) đối với", "Dẫn ra đối tượng của hành động hoặc sự việc liên quan, thường đứng trước danh từ, ít dùng với động từ/phó từ. Chú ý: câu dùng 对于 đều thay được bằng 对, nhưng có câu dùng 对 thì không thay được bằng 对于. 对 có thể dẫn trực tiếp người, 对于 thì không.", "对于这个问题，大家都很感兴趣。\n大家对于这个问题的看法不一样。 (có thể nói: 大家对这个问题的看法不一样)\nKhông nói: 朋友们对于我很热情"], ["【词语用法】而 (liên) và, nhưng", "Hai cách dùng thường gặp: 1) Văn viết, nối hai tính từ/cụm tính từ song song, bổ sung cho nhau. 2) Nối tính từ, động từ, mệnh đề để chuyển ý, giống 但是 / 却.", "她是一个聪明而美丽的姑娘。\n这种水果好看而不好吃。\n哈尔滨还很冷，而中国南方已经春暖花开了。"], ["【词语用法】只好 (phó) đành phải", "Biểu thị (trong hoàn cảnh nào đó) không có lựa chọn khác, đành phải làm như vậy.", ""]], "2": [["【注释】唐诗", "Thơ của đời Đường. Nhà Đường (618–907) là một triều đại hưng thịnh của Trung Quốc cổ đại, kinh đô Trường An, nay là Tây An, tỉnh Thiểm Tây.", ""], ["【词语用法】靠 (động) dựa vào", "Có 3 nghĩa: 1) nương tựa, dựa vào; 2) gần, sát một nơi nào đó; 3) người/vật tựa vào người/vật khác.", "她学习这么好，全靠自己的努力。\n屋子里，靠墙放着一张桌子。\n别靠在我身上。"], ["【词语用法】分别 (phó) riêng biệt", "Có 2 nghĩa: 1) dùng cách khác nhau, có phân biệt; 2) nhiều chủ thể với nhiều đối tượng, mỗi bên làm riêng.", "对不同情况，应该分别对待。\n我们班的同学分别来自亚洲、非洲、欧洲、美洲、大洋洲等五大洲十一个国家。"], ["【词语用法】各 (đại) mỗi, các", "Chỉ tất cả cá thể trong một phạm vi, dùng trước danh từ hoặc lượng từ. So sánh 各 và 每: 1) đều chỉ mọi cá thể, nhưng 每 nhấn mạnh \"mọi\", 各 nhấn mạnh \"từng cái riêng\"; 2) 各 đứng trực tiếp trước một số danh từ, 每 phải có lượng từ mới đứng trước danh từ (trừ 人, 家, 年, 月, 日, 天, 星期, 周); 3) 每 kết hợp được với số lượng từ, 各 thì không.", "请各班同学快上车吧。\n各国、各学校、各医院 (không nói 每国, 每学校)\n他每一门课都学得很好。(không nói 各一门)"], ["【词语用法】表示 (động, danh) biểu thị", "Động từ: 1) dùng lời nói, hành động để bày tỏ ý nghĩ, tình cảm, thái độ; có thể mang 了/过, lặp lại, mang tân ngữ; 2) bản thân sự vật cho thấy một ý nghĩa. Danh từ: lời nói, hành động hoặc nét mặt thể hiện suy nghĩ, tình cảm.", "朋友们看到以后，都向我表示祝贺。\n点头表示同意。\n她这样做是友好的表示。"]], "3": [["【词语用法】拿 (giới)", "Cấu trúc 拿+danh từ+来+động từ dùng để nêu ra một chủ đề; động từ chỉ hạn trong 说、看、讲、比、比较、分析…", "就拿首都北京来说吧，就和全国大部分地区一样，有春、夏、秋、冬四个季节。\n中国这些年发展很快，拿人们的生活水平来说，比过去有很大的提高。"], ["【词语用法】动词 + 下", "2 nghĩa: 1) hành động hoàn thành và có ý \"tách ra, bỏ ra\"; 2) người/vật theo hành động từ chỗ cao xuống chỗ thấp.", "一到春天，人们都脱下冬衣，换上春装。\n请同学们快坐下，我们上课了。\n她感动得流下了眼泪。"], ["【词语用法】动词 + 上", "2 nghĩa: 1) hành động có kết quả, có khi mang ý \"khép lại, gắn lại\"; 2) người/vật theo hành động từ thấp lên cao, hoặc đạt được mục đích.", "我把窗户关上，锁上门，咱们就走。\n他提着书爬上了十楼。\n她今年终于考上了大学。"], ["【词语用法】多么 (phó) biết bao", "Thường dùng trong câu cảm thán, biểu thị mức độ rất cao, cách dùng giống phó từ 多.", "能出国学习多么/多不容易啊！\n多么/多有意思啊！"], ["【词语用法】也许 (phó) có lẽ", "Biểu thị phỏng đoán hoặc không chắc chắn, thường đặt trước động từ, tính từ hoặc chủ ngữ làm trạng ngữ.", "别着急，再好好儿找找，也许能找到。\n到现在他还没来，也许就不来了，我们不要等他了。"]], "4": [["【词语用法】一点儿 + 也/都 + 不/没……", "一点儿 chỉ số lượng rất ít, đặt trước 不/没 để phủ định hoàn toàn, nghĩa như 根本、完全. Giữa 一点儿 và 不/没 thường chèn 也、都.", "你说的这件事我一点儿都不知道。\n刚来时，我一点儿也听不懂中国人说的话。"], ["【词语用法】当然 (phó) đương nhiên", "Khẳng định, không nghi ngờ; dùng trước động từ hoặc trước chủ ngữ, có thể dùng riêng hoặc để đáp lời. \"当然……，不过……\" biểu thị chuyển ý, gần như 虽然……但是……, giọng nhẹ hơn.", "我读的是中文系，当然希望有机会去中国留学。\nA：你也想去桂林旅行吗？ B：当然。"], ["【词语用法】不过 (liên) nhưng", "Chuyển ý, nhẹ hơn 但是, đặt đầu vế sau, hay dùng trong khẩu ngữ.", "房间不大，不过一个人够住了。\n这一课的生词比较多，不过都不难。"], ["【词语用法】简直 (phó) quả thực", "Dùng trước động từ làm trạng ngữ, nhấn mạnh hoàn toàn như vậy hoặc gần như vậy, mang giọng cường điệu.", "她汉语说得简直跟中国人一样，真让人羡慕。\n他说的是什么？我简直一点儿也听不懂。"], ["【词语用法】从 (phó) từ trước đến nay", "Nghĩa là 从来, từ quá khứ đến hiện tại đều như vậy; dùng trước từ phủ định.", "我从（来）不吸烟。\n我以前从没来过中国，这是第一次。"], ["【词语用法】偷偷儿 (phó) lén lút", "Hành động không cho người khác biết; đặt trước động từ hoặc tính từ làm trạng ngữ.", "他看大家不注意，就偷偷儿离开了。\n一天，她偷偷儿把一封信放在了我的书包里。"], ["【词语用法】\"动词+着\"+\"动词+着\"……", "Lặp lại \"động từ+着\" biểu thị đang làm một hành động thì hành động khác xảy ra tiếp theo.", "有一段时间我常常一个人偷偷儿地哭，有时哭着哭着就睡着了。"]]}, "i": {"1": [["恋恋不舍", "liànliàn-bùshě", "Lưu luyến không nỡ rời (xuất hiện trong từ mới bài 1)"]], "3": [["鸟语花香", "niǎoyǔ-huāxiāng", "chim hót hoa thơm (cảnh xuân)"], ["烈日高照", "lièrì gāozhào", "nắng gắt chói chang"], ["秋高气爽", "qiūgāo-qìshuǎng", "trời thu cao, khí trời mát mẻ"], ["万里雪飘", "wànlǐ xuěpiāo", "tuyết bay muôn dặm"], ["瑞雪兆丰年", "ruìxuě zhào fēngnián", "tuyết lành báo hiệu mùa bội thu"]], "4": [["酸甜苦辣", "suān-tián-kǔ-là", "chua ngọt đắng cay, đủ vị của cuộc sống"], ["书到用时方恨少", "Shū dào yòng shí fāng hèn shǎo", "(tục ngữ) đến lúc dùng mới hận sách đọc ít"], ["事非经过不知难", "Shì fēi jīngguò bù zhī nán", "(tục ngữ) việc chưa trải qua thì không biết khó"], ["不到长城非好汉", "Bú dào Chángchéng fēi hǎohàn", "(tục ngữ) chưa đến Trường Thành chưa phải hảo hán"], ["少壮不努力，老大徒伤悲", "Shàozhuàng bù nǔlì, lǎodà tú shāngbēi", "(tục ngữ) trẻ không cố gắng, già chỉ thêm buồn"]]}};
